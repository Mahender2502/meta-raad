# One image builds React and serves it alongside the FastAPI API.
# Start both: docker compose up -d --build
# Website/API: http://localhost:8180
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./runs:/runs:ro
      - ./data:/data:ro
      - ./backend/data:/app/data
      - hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      STATS_DIR: /app/data
      RUNS_DIR: /runs
    ports:
      - "127.0.0.1:${META_RAAD_PORT:-8180}:8080"
    restart: unless-stopped

volumes:
  hf_cache:
