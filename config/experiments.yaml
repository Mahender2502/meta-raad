# Experiment configuration for Meta-RAAD (see spec.md)

# RA-ZAD: retrieval-augmented zero-shot anomaly detection
retrieval:
  k_values: [0, 1, 2, 3, 5]   # k=0 is the plain AD-LLM zero-shot baseline
  metric: cosine
  chromadb_host: chromadb
  chromadb_port: 8000

# FG-MOS: feature-grounded model selection
meta_features:
  - intra_class_compactness   # C_intra
  - inter_class_separability  # S_inter

# G_score: grounding rate of the rationale (scripted meta-feature citation check)
grounding:
  metric: g_score

evaluation:
  metrics:
    - auroc
    - auprc
  seed: 42

settings:
  - normal_only
  - normal_anomaly
