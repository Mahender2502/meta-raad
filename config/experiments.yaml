# Experiment Configurations

retrieval:
  k_values: [0, 1, 2, 3, 5]
  embedding_model: all-MiniLM-L6-v2
  chromadb_host: chromadb
  chromadb_port: 8000

self_consistency:
  m_values: [1, 3, 5, 7]
  temperatures: [0.3, 0.5, 0.7]
  aggregation_methods:
    - mean
    - median
    - weighted

explanation_eval:
  judge_model: gpt-4o-mini
  dimensions:
    - faithfulness
    - specificity
    - informativeness
  scale:
    min: 1
    max: 5

evaluation:
  metrics:
    - auroc
    - auprc
  seed: 42

settings:
  - normal_only
  - normal_anomaly
